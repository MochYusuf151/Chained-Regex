<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Chained Regex Pipeline</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
                    <circle cx="5" cy="13" r="3.4" stroke="#57e0c0" stroke-width="2" />
                    <circle cx="13" cy="5" r="3.4" stroke="#9c8cf7" stroke-width="2" />
                    <circle cx="21" cy="13" r="3.4" stroke="#57e0c0" stroke-width="2" />
                    <path d="M8 11L10.5 7.5M15.5 7.5L18 11" stroke="#5b6376" stroke-width="1.6"
                        stroke-linecap="round" />
                    <circle cx="13" cy="19" r="3.4" stroke="#9c8cf7" stroke-width="2" />
                    <path d="M10.5 15L7 17M15.5 15L19 17" stroke="#5b6376" stroke-width="1.6" stroke-linecap="round" />
                </svg>
                <div class="brand-text">
                    <span class="brand-title" id="docTitleLabel">Chained Regex Pipeline</span>
                    <span class="brand-sub">Client-side · nothing leaves your browser</span>
                </div>
            </div>
            <div class="topbar-actions">
                <!-- Tambahkan di .topbar-actions pada index.html -->
                <label class="switch-row" style="margin-right:8px;">
                    <span class="switch">
                        <input type="checkbox" id="autoComputeToggle" checked>
                        <span class="track"></span>
                        <span class="thumb"></span>
                    </span>
                    Auto-run
                </label>
                <button class="btn btn-primary" id="runPipelineBtn">
                    ▶ Run Pipeline
                </button>
                <button class="btn btn-ghost btn-icon" id="resetBtn" title="Reset pipeline">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12a9 9 0 1 0 3-6.7" />
                        <path d="M3 4v5h5" />
                    </svg>
                </button>
                <button class="btn btn-primary" id="copyResultBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                    </svg>
                    Copy Result
                </button>
                <button class="btn btn-secondary" id="copyLinkBtn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.2">
                        <path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1" />
                        <path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1" />
                    </svg>
                    Copy share link
                </button>
            </div>
        </div>
    </div>

    <div class="shell">

        <div class="panel">
            <div class="config-grid">
                <div class="field" style="margin-bottom:0;">
                    <label for="titleField">Title</label>
                    <input type="text" class="input" id="titleField" placeholder="e.g. Log line normalizer"
                        maxlength="80">
                </div>
                <div class="field" style="margin-bottom:0;">
                    <label for="descField">Description</label>
                    <input type="text" class="input" id="descField" placeholder="What does this pipeline do?"
                        maxlength="200">
                </div>
            </div>
        </div>

        <div class="pipeline" id="pipeline"></div>

        <div class="add-stage-row">
            <button class="add-stage-btn" id="addStageBtn">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
                    <path d="M12 5v14M5 12h14" />
                </svg>
                Add pipeline stage
            </button>
        </div>

        <div class="footer-note">Everything — title, description, and every stage — is encoded into the URL, so the link
            alone can restore and share this exact pipeline.</div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="js/main.js" type="text/javascript" charset="UTF-8"></script>
</body>

</html>
