<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Text Transformation Pipeline</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <link rel="stylesheet" href="css/style.css?v=5">
    <link rel="page icon" href="favicon.svg">
</head>

<body>

    <header class="topbar">
    <div class="topbar-inner">
        <div class="brand">
            <img src="favicon.svg" width="28" height="28" alt="Regex Pipeline logo">
            <div class="brand-text">
                <span class="brand-title" id="docTitleLabel">Text Transformation Pipeline</span>
                <span class="brand-sub">Client-side Text Processor</span>
            </div>
        </div>

        <div class="topbar-actions">
            <!-- Grup 1: kontrol pipeline -->
            <div class="action-group">
                <label class="switch-row" title="Jalankan pipeline otomatis saat input berubah">
                    <span class="switch">
                        <input type="checkbox" id="autoComputeToggle" checked>
                        <span class="track"></span>
                        <span class="thumb"></span>
                    </span>
                    <span class="switch-label">Auto-run</span>
                </label>

                <button class="btn btn-primary" id="runPipelineBtn">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z" />
                    </svg>
                    <span class="btn-label">Run Pipeline</span>
                </button>

                <button class="btn btn-ghost btn-icon" id="resetBtn" title="Reset pipeline" aria-label="Reset pipeline">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 12a9 9 0 1 0 3-6.7" />
                        <path d="M3 4v5h5" />
                    </svg>
                </button>
            </div>

            <span class="divider" aria-hidden="true"></span>

            <!-- Grup 2: aksi output -->
            <div class="action-group">
                <button class="btn btn-secondary" id="copyResultBtn">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1" />
                    </svg>
                    <span class="btn-label">Copy Result</span>
                </button>

                <button class="btn btn-ghost" id="copyLinkBtn">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1" />
                        <path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1" />
                    </svg>
                    <span class="btn-label">Share link</span>
                </button>
            </div>
        </div>
    </div>
</header>

    <div class="shell">

        <div class="panel">
            <div class="config-grid">
                <div class="field" style="margin-bottom:0;">
                    <label for="titleField">Title</label>
                    <input type="text" class="input" id="titleField" placeholder="e.g. Log line normalizer"
                        maxlength="80">
                </div>
                <div class="field" style="margin-bottom:0;">
                    <label for="descField">Description</label>
                    <input type="text" class="input" id="descField" placeholder="What does this pipeline do?"
                        maxlength="200">
                </div>
            </div>
        </div>

        <div class="pipeline" id="pipeline"></div>

        <div class="add-stage-row">
            <button class="add-stage-btn" id="addStageBtn">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
                    <path d="M12 5v14M5 12h14" />
                </svg>
                Add pipeline stage
            </button>
        </div>

        <div class="footer-note">Everything — title, description, and every stage — is encoded into the URL, so the link
            alone can restore and share this exact pipeline.</div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="js/main.js" type="text/javascript" charset="UTF-8"></script>
</body>

</html>
